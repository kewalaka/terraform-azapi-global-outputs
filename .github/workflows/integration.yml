name: Integration Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "**.md"
      - ".release-please-manifest.json"
  workflow_dispatch:

# Prevent concurrent applies against the same state.
# cancel-in-progress: false so an in-flight apply never gets abandoned mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: examples/full
  # Temp Azure CLI profile — avoids touching ~/.azure on the runner
  AZURE_CONFIG_DIR: /tmp/azure-ci-${{ github.run_id }}

jobs:
  # ── Build the custom azapi provider binary ────────────────────────────────
  # Keyed to the provider branch's HEAD commit so cache is invalidated
  # automatically when the branch is updated.
  build-provider:
    name: Build custom azapi provider
    runs-on: ubuntu-latest
    outputs:
      provider_sha: ${{ steps.sha.outputs.sha }}
      cache_key: ${{ steps.sha.outputs.cache_key }}
    steps:
      - name: Resolve provider branch HEAD
        id: sha
        run: |
          SHA=$(git ls-remote https://github.com/kewalaka/terraform-provider-azapi \
            refs/heads/kewalaka/add-table-storage-dataplane | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "cache_key=azapi-provider-${{ runner.os }}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore cached provider binary
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/terraform-plugins/terraform-provider-azapi
          key: ${{ steps.sha.outputs.cache_key }}

      - name: Clone provider source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch kewalaka/add-table-storage-dataplane \
            https://github.com/kewalaka/terraform-provider-azapi.git /tmp/provider-src

      - uses: actions/setup-go@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.26"
          cache-dependency-path: /tmp/provider-src/go.sum

      - name: Build provider
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/terraform-plugins
          cd /tmp/provider-src
          go build -o ~/.local/terraform-plugins/terraform-provider-azapi .

      - name: Save provider binary to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/terraform-plugins/terraform-provider-azapi
          key: ${{ steps.sha.outputs.cache_key }}

  # ── terraform plan ────────────────────────────────────────────────────────
  # Runs on every push and PR. Uploads tfplan as an artifact to the apply job
  plan:
    name: Terraform Plan
    needs: build-provider
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC token exchange
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    outputs:
      artifact_name: tf-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore provider binary
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/terraform-plugins/terraform-provider-azapi
          key: ${{ needs.build-provider.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure Terraform dev_overrides
        run: |
          PLUGIN_DIR="$HOME/.local/terraform-plugins"
          cat > ~/.terraformrc <<TFRC
          provider_installation {
            dev_overrides {
              "Azure/azapi" = "$PLUGIN_DIR"
            }
            direct {}
          }
          TFRC

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"

      # azapi_client_config cannot resolve object_id for an OIDC service principal, so
      # the RBAC assignment gets planned with an empty principalId and apply fails with
      # InvalidPrincipalId. Prefer the ARM_PRINCIPAL_ID variable, which needs no token;
      # otherwise derive the oid claim from an ARM token. Deriving requires a federated
      # credential matching this trigger, which does not exist for arbitrary branches.
      - name: Azure login (principal lookup)
        id: az_login
        if: vars.ARM_PRINCIPAL_ID == ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      # Fails the job with an actionable message when the principal cannot be resolved,
      # rather than letting an empty principalId reach Azure.
      - name: Export principal object ID
        run: |
          set -euo pipefail
          OID="${{ vars.ARM_PRINCIPAL_ID }}"
          # continue-on-error keeps a failed login from ending the job before this
          # step can explain it, so surface that failure explicitly here.
          if [ "${{ steps.az_login.outcome }}" = "failure" ]; then
            echo "::warning::Azure login failed, so the object ID cannot be derived from a token. This is expected on a trigger with no matching federated credential."
          fi
          if [ -z "$OID" ] && [ "${{ steps.az_login.outcome }}" = "success" ]; then
            # Only the oid claim is extracted; the token itself is never printed.
            PAYLOAD=$(az account get-access-token --resource https://management.azure.com/ \
              --query accessToken -o tsv | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#PAYLOAD} % 4 )) in
              2) PAYLOAD="${PAYLOAD}==" ;;
              3) PAYLOAD="${PAYLOAD}=" ;;
            esac
            OID=$(printf '%s' "$PAYLOAD" | base64 -d | jq -r '.oid // empty')
          fi
          if [ -z "$OID" ]; then
            echo "::error::Could not resolve the principal object ID. Set the ARM_PRINCIPAL_ID repository variable to the object ID of the service principal (az ad sp show --id <ARM_CLIENT_ID> --query id -o tsv)."
            exit 1
          fi
          echo "TF_VAR_principal_id=${OID}" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -upgrade

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -input=false -detailed-exitcode
        # exit 0 = no changes, exit 1 = error, exit 2 = changes pending
        # The step succeeds on exit 0 or 2 (changes are expected).
        continue-on-error: true
        id: plan

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure' && steps.plan.outputs.exitcode == '1'
        run: exit 1

      # Bundle plan + the state as it was at plan time.
      # Guarantees the apply job uses the same (plan, state) pair — no race condition.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tf-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          if-no-files-found: warn
          retention-days: 2

  # ── terraform apply ───────────────────────────────────────────────────────
  # Only runs on pushes to main (and workflow_dispatch).
  # Gated by the 'integration' GitHub Environment — a reviewer must approve
  # before this job starts.
  apply:
    name: Terraform Apply
    needs: [build-provider, plan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Restore provider binary
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/terraform-plugins/terraform-provider-azapi
          key: ${{ needs.build-provider.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure Terraform dev_overrides
        run: |
          PLUGIN_DIR="$HOME/.local/terraform-plugins"
          cat > ~/.terraformrc <<TFRC
          provider_installation {
            dev_overrides {
              "Azure/azapi" = "$PLUGIN_DIR"
            }
            direct {}
          }
          TFRC

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"

      # Same principal resolution as the plan job. Required because terraform destroy
      # re-evaluates the configuration rather than replaying the saved plan. This job
      # runs in the integration environment, so its federated credential matches.
      - name: Azure login (principal lookup)
        id: az_login
        if: vars.ARM_PRINCIPAL_ID == ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Export principal object ID
        run: |
          set -euo pipefail
          OID="${{ vars.ARM_PRINCIPAL_ID }}"
          # continue-on-error keeps a failed login from ending the job before this
          # step can explain it, so surface that failure explicitly here.
          if [ "${{ steps.az_login.outcome }}" = "failure" ]; then
            echo "::warning::Azure login failed, so the object ID cannot be derived from a token. This is expected on a trigger with no matching federated credential."
          fi
          if [ -z "$OID" ] && [ "${{ steps.az_login.outcome }}" = "success" ]; then
            # Only the oid claim is extracted; the token itself is never printed.
            PAYLOAD=$(az account get-access-token --resource https://management.azure.com/ \
              --query accessToken -o tsv | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#PAYLOAD} % 4 )) in
              2) PAYLOAD="${PAYLOAD}==" ;;
              3) PAYLOAD="${PAYLOAD}=" ;;
            esac
            OID=$(printf '%s' "$PAYLOAD" | base64 -d | jq -r '.oid // empty')
          fi
          if [ -z "$OID" ]; then
            echo "::error::Could not resolve the principal object ID. Set the ARM_PRINCIPAL_ID repository variable to the object ID of the service principal (az ad sp show --id <ARM_CLIENT_ID> --query id -o tsv)."
            exit 1
          fi
          echo "TF_VAR_principal_id=${OID}" >> "$GITHUB_ENV"

      # Download the exact { tfplan, terraform.tfstate } pair from the plan job.
      # This guarantees apply uses the state that plan was generated against.
      - name: Download plan artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: terraform init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -upgrade

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # Always attempt cleanup, including after a failed apply, so test resources are
      # not left behind. Uses the same working directory, local state file, provider
      # binary and credentials as the apply, and is scoped to this run's state only.
      # A cleanup failure fails the job and never masks the original apply failure.
      # Note: if the runner is terminated (hard cancellation, runner loss), no step is
      # guaranteed to run, so cleanup cannot be guaranteed in that case.
      - name: terraform destroy
        id: destroy
        if: always() && steps.init.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false

      # Report anything still present in state after cleanup so leaked resources can be
      # removed manually. Prints resource addresses only (no attribute values), and the
      # resource group name, which already appears in the plan output. Deliberately does
      # not upload terraform.tfstate: this repository is public, so run artifacts are
      # downloadable by anyone and state may contain sensitive attribute values.
      - name: Report surviving resources
        if: always() && steps.destroy.outcome == 'failure'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -uo pipefail
          echo "::warning::terraform destroy did not complete. Resources below may still exist and need manual removal."
          terraform state list || true
          RG=$(terraform state show -no-color azapi_resource.resource_group 2>/dev/null \
            | awk -F'"' '/^ *name *=/ {print $2; exit}')
          if [ -n "${RG:-}" ]; then
            echo "::warning::Resource group possibly left behind: ${RG}"
          fi
